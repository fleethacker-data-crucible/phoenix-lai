<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr4" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="880" height="330" rx="16" fill="#f8fafc"/>
  <text x="440" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Phoenix through Fairlead</text>

  <!-- Phoenix -->
  <rect x="30" y="120" width="200" height="110" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="130" y="152" text-anchor="middle" font-size="17" font-weight="700" fill="#312e81">Phoenix Client</text>
  <text x="130" y="176" text-anchor="middle" font-size="12" fill="#4338ca">Provider: Fairlead</text>
  <text x="130" y="196" text-anchor="middle" font-size="12" fill="#4338ca">http://127.0.0.1:8776/v1</text>

  <!-- Fairlead -->
  <rect x="330" y="100" width="220" height="150" rx="12" fill="#fdf4ff" stroke="#a855f7" stroke-width="2"/>
  <text x="440" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#6b21a8">Fairlead gateway</text>
  <text x="440" y="156" text-anchor="middle" font-size="12" fill="#7e22ce">Checks fl- client key</text>
  <text x="440" y="176" text-anchor="middle" font-size="12" fill="#7e22ce">Privacy scan</text>
  <text x="440" y="196" text-anchor="middle" font-size="12" fill="#7e22ce">Routes: local, smart, fast</text>
  <text x="440" y="226" text-anchor="middle" font-size="12" fill="#7e22ce">Kedge: local only when offline</text>

  <!-- Local -->
  <rect x="640" y="50" width="210" height="100" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="745" y="82" text-anchor="middle" font-size="16" font-weight="700" fill="#065f46">Local route</text>
  <text x="745" y="106" text-anchor="middle" font-size="12" fill="#047857">Phoenix Local Server</text>
  <text x="745" y="126" text-anchor="middle" font-size="12" fill="#059669">localhost:1234/v1</text>

  <!-- Cloud -->
  <rect x="640" y="180" width="210" height="100" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="745" y="212" text-anchor="middle" font-size="16" font-weight="700" fill="#9a3412">Cloud route</text>
  <text x="745" y="236" text-anchor="middle" font-size="12" fill="#c2410c">Your cloud API</text>
  <text x="745" y="256" text-anchor="middle" font-size="12" fill="#ea580c">key kept in Fairlead</text>

  <line x1="230" y1="175" x2="328" y2="175" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr4)"/>
  <line x1="550" y1="160" x2="638" y2="110" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr4)"/>
  <line x1="550" y1="200" x2="638" y2="230" stroke="#64748b" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arr4)"/>

  <text x="440" y="300" text-anchor="middle" font-size="12" fill="#475569">Phoenix sends its model name as a route. Fairlead chooses the target.</text>
  <text x="440" y="318" text-anchor="middle" font-size="12" fill="#64748b">A private message (secret detected) stays on the local route.</text>
</svg>
