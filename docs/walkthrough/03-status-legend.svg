<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="880" height="230" font-family="Segoe UI, Arial, sans-serif">
  <rect width="880" height="230" rx="16" fill="#f8fafc"/>
  <text x="440" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Provider status colours</text>

  <!-- Green -->
  <rect x="40" y="70" width="250" height="130" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <circle cx="82" cy="115" r="14" fill="#10b981"/>
  <text x="108" y="121" font-size="17" font-weight="700" fill="#065f46">Green: online</text>
  <text x="62" y="160" font-size="13" fill="#334155">Provider answered.</text>
  <text x="62" y="182" font-size="13" fill="#334155">Ready to chat.</text>

  <!-- Red -->
  <rect x="315" y="70" width="250" height="130" rx="12" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <circle cx="357" cy="115" r="14" fill="#ef4444"/>
  <text x="383" y="121" font-size="17" font-weight="700" fill="#991b1b">Red: offline</text>
  <text x="337" y="160" font-size="13" fill="#334155">No answer from the URL.</text>
  <text x="337" y="182" font-size="13" fill="#334155">Check the server or URL.</text>

  <!-- Blue -->
  <rect x="590" y="70" width="250" height="130" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="632" cy="115" r="14" fill="#3b82f6"/>
  <text x="658" y="121" font-size="17" font-weight="700" fill="#1e3a8a">Blue: working</text>
  <text x="612" y="160" font-size="13" fill="#334155">Sending or receiving.</text>
  <text x="612" y="182" font-size="13" fill="#334155">Wait for it to finish.</text>
</svg>
