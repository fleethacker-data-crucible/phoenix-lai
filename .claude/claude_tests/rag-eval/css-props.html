<!doctype html>
<html><head><meta charset="utf-8"><title>css properties</title></head>
<body><pre id="out"></pre>
<script>
  // Every CSS property this browser knows, kebab-case, one per line (read by rag-eval.py's CSS check via --dump-dom).
  const names = new Set();
  const st = document.body.style;
  for (const k in st) {
    if (typeof st[k] !== 'string' || /^\d+$/.test(k) || k === 'cssText') continue;
    names.add(k.replace(/[A-Z]/g, c => '-' + c.toLowerCase()).replace(/^webkit-/, '-webkit-'));
  }
  for (let i = 0; i < st.length; i++) names.add(st[i]);
  document.getElementById('out').textContent = [...names].sort().join('\n');
</script>
</body></html>
