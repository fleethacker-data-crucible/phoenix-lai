<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phoenix Server console</title>
<link rel="icon" type="image/png" href="assets/toolbar_icon.png">
<link rel="stylesheet" href="css/server.css">
<link rel="stylesheet" href="css/fleet-skin.css">
<script src="js/skin.js"></script>
</head>
<body class="console">
<!-- A plain command prompt: output, then the prompt line right after it, like cmd. -->
<div id="term"><div id="out"></div><div class="cmdline"><span class="who" id="who">user@phoenix</span><span class="chev">›</span><div class="typebox"><div id="mirror"><span class="caret"></span></div><input id="cmd" autofocus spellcheck="false" autocomplete="off" aria-label="Command"></div></div></div>
<script src="js/console.js"></script>
</body>
</html>
