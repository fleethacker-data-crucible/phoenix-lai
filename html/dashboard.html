<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phoenix Server dashboard</title>
<link rel="icon" type="image/png" href="assets/toolbar_icon.png">
<link rel="stylesheet" href="css/server.css">
<link rel="stylesheet" href="css/fleet-skin.css">
<script src="js/skin.js"></script>
</head>
<body>
<header class="top"><img src="assets/toolbar_icon.png" alt=""><h1>Phoenix Server</h1><span class="state" id="state"><i></i><span>connecting…</span></span><span class="sp"></span><button id="skinBtn" title="Switch between the Phoenix and Fleet looks">Skin</button><a href="console.html">Console</a></header>
<main class="dash">
  <section class="card wide fleet-welcome" aria-labelledby="fleet-welcome-title">
    <img src="assets/brand/emblem-transparent.png" width="160" height="160" alt="Phoenix LAI: a phoenix rising above a ship binnacle">
    <div><h2 id="fleet-welcome-title">Phoenix LAI</h2><p>Your local model server. Monitor models, memory and requests from this dashboard.</p></div>
  </section>
  <section class="card wide"><h2>What the AI is doing</h2><div class="act" id="act">…</div></section>
  <section class="card"><h2>Model</h2><div class="kv" id="model"></div></section>
  <section class="card"><h2>Server load</h2><div class="big" id="cpu">–</div><div class="bar"><i id="cpuBar" style="width:0"></i></div><svg class="spark" id="cpuSpark" viewBox="0 0 120 48" preserveAspectRatio="none"></svg><div class="kv" id="proc"></div></section>
  <section class="card"><h2>Memory</h2><div class="kv" id="mem"></div></section>
  <section class="card"><h2>Speed</h2><div class="big" id="tps">–</div><svg class="spark" id="tpsSpark" viewBox="0 0 120 48" preserveAspectRatio="none"></svg><div class="kv" id="totals"></div></section>
  <section class="card wide"><h2>Connected clients</h2><div class="tablewrap" id="clients"></div></section>
  <section class="card wide"><h2>Recent requests</h2><div class="tablewrap" id="recent"></div></section>
  <section class="card wide settings"><h2>Settings</h2>
    <div class="row"><label>model</label><select id="sModel"></select><button id="sLoad">load</button><button id="sUnload">unload</button></div>
    <!-- CPU mode (off): <div class="row"><label>device</label><button data-dev="gpu">GPU</button><button data-dev="cpu">CPU</button><span class="note" id="devNote"></span></div> -->
    <div class="row"><label>API format</label><select id="sFormat"><option value="openai">OpenAI /v1 (chat/completions)</option><option value="anthropic">Anthropic (/v1/messages)</option><option value="both">Both</option></select><span class="note" id="fmtNote"></span></div>
    <div class="row" id="sampRow"><label>sampling</label>
      <label class="mini">temperature <input id="spTemp" type="text" inputmode="decimal"></label>
      <label class="mini">top_k <input id="spTopK" type="text" inputmode="numeric"></label>
      <label class="mini">top_p <input id="spTopP" type="text" inputmode="decimal"></label>
      <label class="mini">repeat <input id="spRepeat" type="text" inputmode="decimal"></label>
      <label class="mini">max tokens <input id="spMax" type="text" inputmode="numeric"></label>
      <button id="spSave">save</button><button id="spReset">Gemma 4 defaults</button>
      <span class="note" id="spNote"></span></div>
    <div class="row"><label for="sPort">API port</label><input id="sPort" type="text" inputmode="numeric" maxlength="5" size="6" spellcheck="false" aria-describedby="portNote"><button id="sPortSet">Set</button><span class="note" id="portNote">1024-65535 · changes now, saved</span></div>
    <div class="row"><label>debug log</label><button id="sDebug">toggle</button><span class="note" id="dbgNote"></span></div>
    <div class="note" id="sNote">Endpoints: <span id="eps"></span></div>
  </section>
</main>
<script src="js/dashboard.js"></script>
</body>
</html>
