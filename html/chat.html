<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>phoenix</title>
<link rel="stylesheet" href="css/chat.css">
</head>
<body>
<div id="bgLogo"></div>
<div class="wrap">
  <div id="chat">
  </div>

</div>

<div class="promptline" id="promptLine"><span class="chev">›</span><div class="typebox"><div id="cmds"></div><div id="mirror"></div><textarea id="input" rows="1" spellcheck="false" autofocus aria-label="Message"></textarea></div></div>
<div id="files"></div>
<div id="status"></div>
<div id="ctxmenu">
  <div data-cmd="new">New chat</div>
  <div data-cmd="settings">Settings</div>
  <div data-cmd="folder">Folder</div>
  <div data-cmd="files">Files</div>
  <div data-cmd="index">Reindex docs</div>
  <hr>
  <div data-cmd="copy">Copy</div>
  <div data-cmd="stop">Stop <span class="key">Esc</span></div>
</div>

<div class="modal" id="settingsModal">
  <div class="window">
    <header><h2>Model &amp; settings</h2><button id="closeSettings">✕</button></header>
    <div class="body">
      <div class="section">Model</div>
      <div class="models" id="modelList"></div>
      <div class="grid2">
        <label class="field">Context length<input id="sContext" type="number" min="256" step="256"></label>
        <label class="field">Max tokens per reply<input id="sMax" type="number" min="1"></label>
        <label class="field">Temperature<input id="sTemp" type="number" step="0.05" min="0"></label>
        <label class="field">Top K<input id="sTopK" type="number" min="0"></label>
        <label class="field">Top P<input id="sTopP" type="number" step="0.01" min="0" max="1"></label>
        <label class="field">Repeat penalty<input id="sRepeat" type="number" step="0.01" min="1"></label>
      </div>
      <label class="field" style="margin-top:10px">System prompt<textarea id="sSystem"></textarea></label>
      <div class="note" id="loadNote"></div>
    </div>
    <footer><button id="newChat">New chat</button><button class="primary" id="applySettings">Apply</button></footer>
  </div>
</div>

<div class="modal" id="folderModal">
  <div class="window">
    <header><h2>Project folder</h2><button id="closeFolder">✕</button></header>
    <div class="body">
      <div id="browsePath"></div>
      <div class="dirs" id="dirList"></div>
      <div class="note">The model can list, read and write files only inside the connected folder. Overwritten files are backed up to .llm-backup.</div>
    </div>
    <footer><button id="disconnect">Disconnect</button><button class="primary" id="connect">Connect this folder</button></footer>
  </div>
</div>

<script src="js/markdown.js"></script>
<script src="js/chat.js"></script>
</body>
</html>
